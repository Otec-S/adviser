name: Deploy to reg.ru

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: reg-ru-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload to reg.ru
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS is preferred. If upload fails, try protocol: ftp and port: 21.
          protocol: ftps
          port: 21
          local-dir: ./_site/
          # Document root for adviser-spb.ru in ISPmanager: /www/adviser-spb.ru
          server-dir: ./www/adviser-spb.ru/
          dangerous-clean-slate: false
